<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Box Model</title>
    <style>
        .box {
            width: 300px;
            height: 150px;
            padding: 25px;
            border: 5px solid #2563eb;
            margin: 35px;
            background: #dbeafe;
            outline: 4px dashed #f97316;
            outline-offset: 6px;
            box-sizing: content-box;
            font-family: Arial
        }
    </style>
</head>

<body>
    <h1>CSS Box Model</h1>
    <div class="box">Content area<br>Width: 300px<br>Height: 150px</div>
</body>

</html>
