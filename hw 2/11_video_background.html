<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Background</title>
    <style>
        body {
            margin: 0;
            font-family: Arial
        }

        .hero {
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #222
        }

        .hero video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .hero h1 {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 6px black;
            font-size: clamp(28px, 5vw, 56px);
            margin: 0;
            background: #0003
        }
    </style>
</head>

<body>
    <section class="hero"><video autoplay muted loop playsinline>
            <source src="vid/vid.mp4" type="video/mp4">Your browser does not support video.
        </video>
        <h1>Welcome to Nature..</h1>
    </section>
</body>

</html>
