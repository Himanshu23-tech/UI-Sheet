<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three Divs</title>
    <style>
        .box {
            padding: 25px;
            margin: 15px;
            border-radius: 8px;
            color: white
        }

        .one {
            background: #3949ab
        }

        .two {
            background: #00897b
        }

        .three {
            background: #e65100
        }
    </style>
</head>

<body>
    <h1>Three Styled Div Elements</h1>
    <div class="box one">This is the first div element.</div>
    <div class="box two">This is the second div element.</div>
    <div class="box three">This is the third div element.</div>
</body>

</html>
