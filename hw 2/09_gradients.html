<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gradient Boxes</title>
    <style>
        .box {
            height: 200px;
            margin: 20px;
            padding: 20px;
            color: white;
            font: bold 22px Arial;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .linear {
            background: linear-gradient(to right, #e53935, #fdd835, #43a047)
        }

        .radial {
            background: radial-gradient(circle, #ffeb3b, #fb8c00, #6a1b9a)
        }
    </style>
</head>

<body>
    <div class="box linear">Linear Gradient: Three Colours</div>
    <div class="box radial">Radial Gradient: Three Colours</div>
</body>

</html>
