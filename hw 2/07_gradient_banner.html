<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gradient Banner</title>
    <style>
        body {
            margin: 0;
            font-family: Arial
        }

        .banner {
            background: linear-gradient(45deg, #102a43, #2878a5, #7c4dff);
            color: white;
            padding: 55px 25px;
            margin: 20px;
            border-radius: 12px;
            text-align: center
        }

        .banner h1 {
            font-size: 36px;
            margin: 0 0 12px
        }

        .banner p {
            font-size: 18px
        }
    </style>
</head>

<body>
    <header class="banner">
        <h1>Explore the World</h1>
        <p>Discover new places, cultures, and adventures.</p>
    </header>
</body>

</html>
