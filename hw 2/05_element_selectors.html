<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Element Selectors</title>
    <style>
        h1 {
            color: #283593
        }

        p {
            background: #fff3cd;
            color: #664d03;
            padding: 12px
        }

        span {
            background: #d1e7dd;
            color: #0f5132;
            font-size: 18px;
            padding: 3px
        }
    </style>
</head>

<body>
    <h1>CSS Element Selectors</h1>
    <p>Lorem ipsum dolor sit amet.
    </p>
    <p>Lorem ipsum, <span>dolor sit amet </span>consectetur adipisicing elit. Incidunt, vitae?</p>
</body>

</html>
