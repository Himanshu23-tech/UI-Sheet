<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Universal Selector</title>
    <style>
        * {
            font-size: 18px;
            line-height: 1.7
        }

        body {
            font-family: Arial;
            margin: 25px
        }

        h1 {
            color: #155e75
        }

        p {
            color: #444
        }

        li {
            color: #7c2d12
        }
    </style>
</head>

<body>
    <h1>Universal Selector</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis, architecto!</p>
    <ul>
        <li>First list item</li>
        <li>Second list item</li>
        <li>Third list item</li>
    </ul>
</body>

</html>
