<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Feedback Form</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #7c3aed, #2563eb, #06b6d4);
            background-size: 200% 200%;
            animation: bg 9s ease infinite
        }

        @keyframes bg {
            0% {
                background-position: 0 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0 50%
            }
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 35px #11182745;
            animation: fade .7s ease both
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(18px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #312e81
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
            color: #263247
        }

        label.required:after {
            content: ' *';
            color: #dc2626
        }

        input:not([type=radio]):not([type=checkbox]),
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #b7c1d1;
            border-radius: 7px;
            font: inherit;
            outline: none;
            transition: .25s
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #6366f133
        }

        input::placeholder,
        textarea::placeholder {
            color: #7b8494;
            font-style: italic
        }

        .radio-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap
        }

        .radio-row label,
        .check-row label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 8px 0;
            font-weight: normal
        }

        textarea {
            min-height: 100px;
            resize: vertical
        }

        button {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #4338ca;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s
        }

        button:hover {
            background: #312e81;
            transform: translateY(-2px)
        }

        @media(max-width:500px) {
            body {
                padding: 12px
            }

            .container {
                padding: 20px 16px
            }

            h1 {
                font-size: 25px
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Feedback Form</h1>
        <form action="#" method="post">
            <label class="required" for="name">Name</label>
            <input id="name" name="name"
                type="text" placeholder="Enter your full name" required>

            <label class="required" for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="example@email.com"
                required>

            <label class="required" for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" placeholder="10-digit phone number" pattern="[0-9]{10}" required>
            
            <label class="required" for="service">Service Type</label>
            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option>Website</option>
                <option>Customer Support</option>
                <option>Product</option>
                <option>Other</option>
            </select>
            
            <label for="comments">Comments</label><textarea id="comments" name="comments"
                placeholder="Write your feedback here..."></textarea>
            <div class="check-row">
                <label><input type="checkbox" name="contact" value="yes"> I agree to be
                    contacted</label>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
    </div>
</body>

</html>
