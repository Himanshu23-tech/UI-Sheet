<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Welcome</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #dceeff;
            color: #183153;
            transition: .3s
        }

        main {
            max-width: 850px;
            margin: 60px auto;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px #0002
        }

        h1 {
            font-size: 42px
        }

        p {
            font-size: 19px;
            line-height: 1.7
        }

        @media(max-width:600px) {
            body {
                background: #fff0d6;
                color: #8b3d19
            }

            main {
                margin: 18px;
                padding: 22px;
                background: #fffaf2
            }

            h1 {
                font-size: 28px
            }

            p {
                font-size: 16px
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Welcome to My Website!</h1>
        <p>This page changes its background colour, heading colour and paragraph size on smaller screens. Resize your
            browser window to test the media query.</p>
    </main>
</body>

</html>
