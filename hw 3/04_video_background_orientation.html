<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Welcome to Our Website</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #101820;
            color: white
        }

        .hero {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px
        }

        .hero video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0
        }

        .hero:after {
            content: '';
            position: absolute;
            inset: 0;
            background: #06121a99;
            z-index: 1
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            text-shadow: 0 2px 8px black
        }

        h1 {
            font-size: clamp(30px, 5vw, 58px)
        }

        p {
            font-size: 18px;
            line-height: 1.6
        }

        .portrait {
            display: none
        }

        @media(orientation:portrait) {
            .landscape {
                display: none
            }

            .portrait {
                display: block
            }
        }

        @media(orientation:landscape) {
            .landscape {
                display: block
            }

            .portrait {
                display: none
            }
        }
    </style>
</head>

<body>
    <section class="hero"><video class="landscape" autoplay loop muted playsinline>
            <source src="vid/landscape.mp4" type="video/mp4">
        </video><video class="portrait" autoplay loop muted playsinline>
            <source src="vid/portrait.mp4" type="video/mp4">
        </video>
        <div class="content">
            <h1>Welcome to Our Website</h1>
            <p>The video changes according to landscape or portrait
                orientation.</p>
        </div>
    </section>
</body>

</html>
