<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Register</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body class="bg-black m-4">
        <header>
            <!-- place navbar here -->
        </header>
        <main>
                    <h2 style="text-align: center; font-style: italic; text-decoration: underline goldenrod; color: antiquewhite;">Join with us</h2>
                    
                    <div
                        class="container col-md-5 border p-4 rounded shadow-lg"
                    >
                     <form action="login.html" class="text-warning" style="font-style: italic; font-size: medium;">
                        <div class="mb-3">
                            <label for="" class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder="Enter your name"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="" class="form-label">Age</label>
                            <input
                                type="number"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder="Enter your age"
                               
                            />
                        </div>

                        <div class="mb-3">
                            <label for="" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="emailHelpId"
                                placeholder="abc@mail.com"
                            />
                        </div>

                        <div class="mb-3">
                            <label for="" class="form-label">DOB</label>
                            <input
                                type="date"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder=""
                            />
                        </div>

                        <div class="mb-3">
                            <label for="" class="form-label">Choose file</label>
                            <input
                                type="file"
                                class="form-control"
                                name=""
                                id=""
                                placeholder=""
                                aria-describedby="fileHelpId"
                            />
                        </div>

                        <div class="mb-3">
                            <label for="" class="form-label">City</label>
                            <select
                                class="form-select form-select-lg"
                                name=""
                                id=""
                            >
                                <option selected>Select one</option>
                                <option value="">New Delhi</option>
                                <option value="">Maharastra</option>
                                <option value="">Chennai</option>
                            </select>
                        </div>
                        
                        

                        <div class="mb-3">
                            <label for="" class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                name=""
                                id=""
                                placeholder="Enter Password"
                            />
                        </div>

                        <button
                            type="submit" action="login.html"
                            class="btn btn-outline-warning"
                        >
                            Submit
                        </button>
                     </form>   
                    </div>
                    
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
